
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos y Pagos - Pan, Puntos y Premios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4">

        <h1 class="mb-4">Operaciones</h1>

        <!-- SECCION DE PEDIDOS -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Pedidos</h3>
            </div>

            <div class="card-body">
                <p>Desde aquí podrás crear y consultar pedidos.</p>

                <button class="btn btn-primary">
                    Crear pedido
                </button>

                <button class="btn btn-outline-primary">
                    Consultar pedidos
                </button>
            </div>
        </div>

        <!-- SECCION DE PAGOS -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Pagos</h3>
            </div>

            <div class="card-body">
                <p>Desde aquí podrás registrar y consultar pagos.</p>

                <button class="btn btn-success">
                    Registrar pago
                </button>

                <button class="btn btn-outline-success">
                    Consultar pagos
                </button>
            </div>
        </div>

        <a href="/" class="btn btn-secondary">
            Volver al inicio
        </a>

    </div>

</body>
</html>
