
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar a un cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow-sm mx-auto" style="max-width: 600px;">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Modificar</h4>
            </div>

            <div class="card-body">

                <form th:action="@{/clientes/actualizar}"
                      method="post">

                    <input type="hidden"
                           name="idClientes"
                           th:value="${cliente.idClientes}">

                    <input type="hidden"
                           name="puntos"
                           th:value="${cliente.puntos}">

                    <input type="hidden"
                           name="activo"
                           th:value="${cliente.activo}">

                    <div class="mb-3">
                        <label class="form-label">Identificación</label>
                        <input type="text"
                               class="form-control"
                               th:value="${cliente.idClientes}"
                               disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text"
                               name="nombre"
                               class="form-control"
                               th:value="${cliente.nombre}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text"
                               name="apellidos"
                               class="form-control"
                               th:value="${cliente.apellidos}"
                               required>
                    </div>

                    <div class="d-flex justify-content-between">

                        <a href="/clientes"
                           class="btn btn-secondary">
                            Cancelar
                        </a>

                        <button type="submit"
                                class="btn btn-success">
                            Guardar cambios
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>

</body>
</html>
