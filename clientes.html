
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Pan, Puntos y Premios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de clientes</h2>
            <a href="/operaciones" class="btn btn-secondary">
                Regresar
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                Clientes registrados
            </div>

            <div class="card-body">
                
                
                <form th:action="@{/clientes/guardar}" method="post"
                    class="row g-3 mb-4">

                <div class="col-md-4">
                    <label class="form-label">Identificación</label>
                    <input type="number" name="idClientes"
                class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre"
                        class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Apellidos</label>
                    <input type="text" name="apellidos"
                        class="form-control" required>
                </div>

                <input type="hidden" name="puntos" value="0">

                <div class="col-12">
                <button type="submit" class="btn btn-success">
                    Registrar cliente
            </button>
    </div>

</form>

<hr>


    <form th:action="@{/clientes/buscar}" method="get"
          class="row g-2 mb-4">

        <div class="col-md-6">
            <input type="number"
                   name="id"
                   class="form-control"
                   placeholder="Buscar por identificación..."
                   th:value="${busqueda}"
                   required>
        </div>

        <div class="col-auto">
            <button type="submit" class="btn btn-primary">
                Buscar
            </button>
        </div>

        <div class="col-auto">
            <a href="/clientes" class="btn btn-secondary">
                Mostrar todos
            </a>
        </div>

    </form>



                <div class="table-responsive">
                    <table class="table table-striped table-hover">

                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellidos</th>
                                <th>Puntos</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        
<tbody>
    <tr th:each="cliente : ${clientes}">

        <td th:text="${cliente.idClientes}"></td>

        <td th:text="${cliente.nombre}"></td>

        <td th:text="${cliente.apellidos}"></td>

        <td th:text="${cliente.puntos}"></td>

        <td>
            <span th:if="${cliente.activo == 1}"
                  class="badge bg-success">
                Activo
            </span>

            <span th:if="${cliente.activo == 0}"
                  class="badge bg-secondary">
                Inactivo
            </span>
        </td>

        <td>
            <a th:href="@{/clientes/editar/{id}(id=${cliente.idClientes})}"
               class="btn btn-warning btn-sm">
                Editar
            </a>

            <a th:href="@{/clientes/eliminar/{id}(id=${cliente.idClientes})}"
               class="btn btn-danger btn-sm">
                Eliminar
            </a>
        </td>

    </tr>

    <tr th:if="${#lists.isEmpty(clientes)}">
        <td colspan="6" class="text-center">
            No hay clientes registrados.
        </td>
    </tr>
</tbody>


                    </table>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
