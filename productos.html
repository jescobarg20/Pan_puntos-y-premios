<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos - Pan, Puntos y Premios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Gestión de productos</h2>

            <a href="/operaciones" class="btn btn-secondary">
                Regresar
            </a>

        </div>

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                Productos registrados
            </div>

            <div class="card-body">

                <!-- FORMULARIO PARA REGISTRAR PRODUCTOS -->

                <form th:action="@{/productos/guardar}" method="post"
                      class="row g-3 mb-4">

                    <div class="col-md-3">
                        <label class="form-label">Identificación</label>
                        <input type="number" name="idmenu"
                               class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre"
                               class="form-control" maxlength="45" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Precio</label>
                        <input type="number" name="precio"
                               class="form-control" min="0.01"
                               step="0.01" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Tipo de producto</label>
                        <select name="individual" class="form-select" required>
                            <option value="1">Individual</option>
                            <option value="0">Combo</option>
                        </select>
                    </div>

                    <input type="hidden" name="activo" value="1">

                    <div class="col-12">
                        <button type="submit" class="btn btn-success">
                            Registrar producto
                        </button>
                    </div>

                </form>

                <hr>

                <!-- TABLA DE PRODUCTOS -->

                <div class="table-responsive">

                    <table class="table table-striped table-hover">

                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Tipo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="producto : ${productos}">

                                <td th:text="${producto.idmenu}"></td>

                                <td th:text="${producto.nombre}"></td>

                                <td th:text="${producto.precio}"></td>

                                <td>
                                    <span th:if="${producto.individual == 1}"
                                          class="badge bg-info text-dark">
                                        Individual
                                    </span>

                                    <span th:if="${producto.individual == 0}"
                                          class="badge bg-warning text-dark">
                                        Combo
                                    </span>
                                </td>

                                <td>
                                    <span th:if="${producto.activo == 1}"
                                          class="badge bg-success">
                                        Activo
                                    </span>

                                    <span th:if="${producto.activo == 0}"
                                          class="badge bg-secondary">
                                        Inactivo
                                    </span>
                                </td>

                                <!-- BOTONES DE ACCIONES -->

<td>
    <a th:href="@{/productos/editar/{id}(id=${producto.idmenu})}"
       class="btn btn-warning btn-sm">
        Editar
    </a>

    <a th:if="${producto.activo == 1}"
       th:href="@{/productos/desactivar/{id}(id=${producto.idmenu})}"
       class="btn btn-danger btn-sm"
       onclick="return confirm('¿Estás seguro de desactivar este producto?');">
        Desactivar
    </a>

    <span th:if="${producto.activo == 0}"
          class="badge bg-secondary">
        Desactivado
    </span>
</td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(productos)}">
                                <td colspan="6" class="text-center">
                                    No hay productos registrados.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
