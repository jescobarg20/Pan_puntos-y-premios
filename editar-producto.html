<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar producto - Pan, Puntos y Premios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                Editar producto
            </div>

            <div class="card-body">

                <form th:action="@{/productos/actualizar}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Identificación</label>
                        <input type="number" name="idmenu"
                               class="form-control"
                               th:value="${producto.idmenu}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre"
                               class="form-control" maxlength="45"
                               th:value="${producto.nombre}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" name="precio"
                               class="form-control" min="0.01"
                               step="0.01"
                               th:value="${producto.precio}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo de producto</label>
                        <select name="individual" class="form-select" required>

                            <option value="1"
                                    th:selected="${producto.individual == 1}">
                                Individual
                            </option>

                            <option value="0"
                                    th:selected="${producto.individual == 0}">
                                Combo
                            </option>

                        </select>
                    </div>

                    <input type="hidden" name="activo"
                           th:value="${producto.activo}">

                    <button type="submit" class="btn btn-success">
                        Guardar cambios
                    </button>

                    <a href="/productos" class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>
        </div>

    </div>

</body>
</html>
